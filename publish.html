<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布信息 · 校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="index.html">
        <span class="brand-logo" id="brandLogo"></span>
        <span>校园失物招领</span>
      </a>
      <nav class="nav-links">
        <a class="nav-link" href="index.html">首页</a>
        <a class="nav-link" href="my-posts.html">我的发布</a>
        <a class="nav-link nav-publish" href="publish.html">发布信息</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="breadcrumb">
        <a href="index.html">首页</a>
        <span>/</span>
        <span>发布信息</span>
      </div>

      <div class="panel">
        <h2 class="panel-title">发布一条失物招领信息</h2>
        <p class="panel-sub">请如实填写物品信息，方便失主 / 拾获者快速联系到你。带 <span style="color:#e5484d">*</span> 为必填项。</p>

        <form id="publishForm" novalidate>
          <!-- 类型选择 -->
          <div class="type-toggle" id="typeToggle">
            <div class="type-card active" data-type="lost" tabindex="0">
              <div class="t-title">🔍 我丢了东西（寻物启事）</div>
              <div class="t-sub">发布后失主（你）等待拾获者联系</div>
            </div>
            <div class="type-card" data-type="found" tabindex="0">
              <div class="t-title">🎁 我捡到东西（失物招领）</div>
              <div class="t-sub">发布后等待失主认领</div>
            </div>
          </div>
          <input type="hidden" name="type" id="typeInput" value="lost">

          <div class="form-grid">
            <div class="field">
              <label for="name">物品名称 <span class="req">*</span></label>
              <input type="text" id="name" name="name" maxlength="30" placeholder="例如：校园一卡通 / 黑色雨伞">
              <span class="err" data-err="name"></span>
            </div>

            <div class="field">
              <label for="category">物品类别 <span class="req">*</span></label>
              <select id="category" name="category">
                <option value="">请选择类别</option>
              </select>
              <span class="err" data-err="category"></span>
            </div>

            <div class="field">
              <label for="location" id="locationLabel">丢失地点 <span class="req">*</span></label>
              <input type="text" id="location" name="location" maxlength="40" placeholder="例如：紫金园食堂二楼 / 图书馆三楼">
              <span class="err" data-err="location"></span>
            </div>

            <div class="field">
              <label for="date">日期 <span class="hint">（可选，不确定可留空）</span></label>
              <input type="date" id="date" name="date">
              <span class="err" data-err="date"></span>
            </div>

            <div class="field full">
              <label for="description">详细描述 <span class="hint">（颜色、特征、内有何物等，最多 300 字）</span></label>
              <textarea id="description" name="description" maxlength="300" placeholder="补充物品的细节特征，方便他人辨认，例如：黑色伞面带小碎花，伞柄有划痕…"></textarea>
              <div class="char-count"><span id="descCount">0</span>/300</div>
              <span class="err" data-err="description"></span>
            </div>

            <div class="field full">
              <label>物品照片 <span class="hint">（可选，最多 3 张，仅保存在本机浏览器）</span></label>
              <div class="uploader" id="uploader">
                <label class="upload-tile" id="uploadTile" for="imageInput">
                  <span id="uploadPlus"></span>
                </label>
                <input type="file" id="imageInput" accept="image/*" multiple hidden>
              </div>
            </div>

            <div class="field">
              <label for="contactName">你的称呼 <span class="req">*</span></label>
              <input type="text" id="contactName" name="contactName" maxlength="20" placeholder="例如：王同学">
              <span class="err" data-err="contactName"></span>
            </div>

            <div class="field">
              <label for="contactType">联系方式类型 <span class="req">*</span></label>
              <select id="contactType" name="contactType">
                <option value="wechat">微信</option>
                <option value="qq">QQ</option>
                <option value="phone">手机号</option>
              </select>
              <span class="err" data-err="contactType"></span>
            </div>

            <div class="field full">
              <label for="contact" id="contactLabel">微信号 <span class="req">*</span></label>
              <input type="text" id="contact" name="contact" maxlength="60" placeholder="填写你的微信号，方便他人联系你">
              <span class="err" data-err="contact"></span>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submitBtn">发布信息</button>
            <button type="reset" class="btn" id="resetBtn">重填</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>校园失物招领 · 结对编程作业（102401134 王清源 &amp; 102401137 佘博海）</span>
      <span>发布成功后可在「我的发布」中管理状态</span>
    </div>
  </footer>

  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/publish.js"></script>
</body>
</html>
