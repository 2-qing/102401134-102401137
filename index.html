<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园失物招领 · 首页</title>
  <meta name="description" content="校园失物招领平台，集中发布寻物与招领信息，支持关键词搜索、分类筛选与状态更新。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 导航栏 -->
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="index.html">
        <span class="brand-logo" id="brandLogo"></span>
        <span>校园失物招领</span>
      </a>
      <nav class="nav-links">
        <a class="nav-link" href="index.html">首页</a>
        <a class="nav-link" href="my-posts.html">我的发布</a>
        <a class="nav-link nav-publish" href="publish.html">发布信息</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      <!-- Hero + 搜索 -->
      <section class="hero">
        <h1>丢了别急，捡了别藏 🤝</h1>
        <p>把寻物启事和失物招领集中到一处：发一条信息，或者搜一下关键词，也许你的东西正在等你。</p>
        <form class="searchbar" id="searchForm" role="search">
          <span class="ic-search" id="searchIcon"></span>
          <input type="text" id="searchInput" placeholder="搜索物品名称、地点、描述…例如「一卡通」「图书馆」" autocomplete="off" aria-label="搜索关键词">
          <button type="submit">搜索</button>
        </form>
      </section>

      <!-- 数据统计 -->
      <section class="stats" id="stats"></section>

      <!-- 筛选工具栏 -->
      <div class="toolbar">
        <div class="seg" id="typeSeg" role="tablist">
          <button data-type="all" class="active">全部</button>
          <button data-type="lost">寻物启事</button>
          <button data-type="found">失物招领</button>
        </div>
        <div class="selects">
          <select id="categorySelect" aria-label="按类别筛选"></select>
          <select id="statusSelect" aria-label="按状态筛选">
            <option value="all">全部状态</option>
            <option value="active">进行中</option>
            <option value="resolved">已解决</option>
          </select>
          <select id="orderSelect" aria-label="排序方式">
            <option value="newest">最新发布</option>
            <option value="oldest">最早发布</option>
          </select>
        </div>
      </div>

      <div class="result-hint" id="resultHint"></div>

      <!-- 信息卡片列表 -->
      <section class="card-grid" id="cardGrid"></section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>校园失物招领 · 结对编程作业（102401134 王清源 &amp; 102401137 佘博海）</span>
      <span>数据保存在本机浏览器（localStorage），仅用于课程演示</span>
    </div>
  </footer>

  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
